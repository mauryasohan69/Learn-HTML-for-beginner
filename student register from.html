<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registation from</title>
</head>
<body bgcolor="Green">
    <center><h1>Student regstation from</h1></center>
    <table align="center"cellpadding ="10" border="5">
        <!----first name-------------------->
    <tr>
     <td>Name</td>
        <td><input type="text"name=first_name"maxlength="30"/>(max 30 characterrs a-z and A-Z)
        </td>
    </tr>

    <!----course Applied for-------------------->
    <tr>
        <td>Course Applied for</td>
        <td>
            <select name="course">
           <option value="MCA">MCA</option>
           <option value="BCA">BCA</option> 
           <option value="PGDCA">PGDCA</option>
           <option value="OLEVEL">OLEVEL</option>
            </select>
        </td>
    </tr>
    <!----Gender--------------------------->
    <tr>
        <td>GENDER</td>
        <td>
            Male<input type="radio"name="Gender"value=Male" />
            Female<input type="radio"name="Gender"value=Female" />
            </td>
            </tr>

            <!----Address--------------------->
            <tr>
                <td>ADDRESS<br/><br/><br/></td>
                <td><textarea name="Address"rows="4"cols="30"></textarea></td>
            </tr>

            <!----country---------------------->
            <tr>
                <td>COUNTRY</td>
                <td><input type="text"name="Country"value="India"readonly="readonly"/></td>
            </tr>
            <!----Hobbies-------------------->

            <tr>
                <td>HOBBIES<br/><br/><br></td>
                <td>
                   Drawing
                    <input type="checkbox"name="Hobby_Drawing"value="Drawing"/>
                    Singing
                    <input type="checkbox"name="Hobby_Singing"value="Singing"/>
                    Dancing
                    <input type="checkbox"name="Hobby_Dancing"value="Dancing"/>
                    Sketching
                    <input type="checkbox"name="Hobby_cooking"value="cooking"/>
                </td>
            </tr>

            <!----Submit and Reset------------------------>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit"value="Submit">
                    <input type="reset"value="Reset">
        </td>
    </tr>
    </table>
</form>  
</body>
</html>
